name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Check ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libasound2-dev libwayland-dev \
            libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxinerama-dev libgl1-mesa-dev libvulkan-dev \
            libfontconfig1-dev
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Check formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all -- --check
      - name: Check compilation
        run: cargo check --locked --target ${{ matrix.target }} --all-targets
      - name: Lint with Clippy
        run: cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Run tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --locked --target ${{ matrix.target }}

  headless:
    name: Headless container (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    container: ubuntu:24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Install the compiler and checkout tools
        run: apt-get update && apt-get install -y --no-install-recommends build-essential ca-certificates curl git
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Verify headless dependency isolation
        run: |
          cargo tree --locked --no-default-features --features cli -e normal --prefix none > headless-dependencies.txt
          if grep -E '^(eframe|egui|wayland-|x11|winit|cpal|rfd|ashpd|fontconfig)' headless-dependencies.txt; then
            exit 1
          fi
      - name: Compile and exercise the headless workstation
        run: |
          cargo clippy --locked --no-default-features --features cli --all-targets -- -D warnings
          cargo test --locked --no-default-features --features cli --test headless_cli
          cargo build --locked --release --no-default-features --features cli --bin rynthv
          env -u DISPLAY -u WAYLAND_DISPLAY ./target/release/rynthv -cli --help
          env -u DISPLAY -u WAYLAND_DISPLAY ./target/release/rynthv -cli doctor --json
