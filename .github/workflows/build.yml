name: Build
run-name: Build packages for ${{ github.ref_name }}

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            platform: windows
            arch: aarch64
            rust_target: aarch64-pc-windows-msvc
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            rust_target: aarch64-unknown-linux-gnu

    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: z
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_PANIC: abort
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
      CARGO_PROFILE_RELEASE_DEBUG: "false"
      CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libasound2-dev libwayland-dev \
            libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxinerama-dev libgl1-mesa-dev libvulkan-dev \
            libfontconfig1-dev
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.rust_target }}
          # Windows packages carry the VC runtime in both executables.
          rustflags: ${{ matrix.platform == 'windows' && '-Ctarget-feature=+crt-static -Clink-arg=/DEBUG:NONE' || '' }}
          cache: false
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch }}-full-lto
      - name: Build both release executables
        run: cargo build --release --locked --target ${{ matrix.rust_target }} --bins

      - name: Set up .NET for WiX
        if: matrix.platform == 'windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Package Windows MSI and ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $wixDir = Join-Path $env:RUNNER_TEMP 'wix'
          dotnet tool install wix --version 6.0.2 --tool-path $wixDir
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          ./packaging/windows/package.ps1 -Arch '${{ matrix.arch }}' `
            -BinaryDir 'target/${{ matrix.rust_target }}/release' -Wix (Join-Path $wixDir 'wix.exe')

      - name: Package Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          bash packaging/linux/package.sh '${{ matrix.arch }}' 'target/${{ matrix.rust_target }}/release'

      - name: Upload standalone Windows MSI
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: rynthv-windows-${{ matrix.arch }}-msi
          path: dist/rynthv-windows-${{ matrix.arch }}.msi
          if-no-files-found: error
          compression-level: 0
      - name: Upload standalone Windows ZIP
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: rynthv-windows-${{ matrix.arch }}-zip
          path: dist/rynthv-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload standalone Linux AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: rynthv-linux-${{ matrix.arch }}-appimage
          path: dist/rynthv-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error
          compression-level: 0

  android:
    name: Android packages
    uses: ./.github/workflows/android.yml
    secrets: inherit

  publish:
    name: Attach individual assets to GitHub Release
    if: github.event_name == 'release'
    needs: [package, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download every standalone artifact
        uses: actions/download-artifact@v4
        with:
          pattern: rynthv-*
          merge-multiple: true
          path: dist
      - name: Attach assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          expected=(
            rynthv-windows-{x86_64,aarch64}.{msi,zip}
            rynthv-linux-{x86_64,aarch64}.AppImage
            rynthv-android-{arm64-v8a,x86_64}.apk
          )
          for file in "${expected[@]}"; do
            test -s "dist/$file"
          done
          gh release upload "$RELEASE_TAG" "${expected[@]/#/dist/}" --repo "$GITHUB_REPOSITORY" --clobber
